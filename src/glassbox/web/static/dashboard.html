<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassbox Dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>

<header>
  <h1>Glassbox</h1>
  <span id="session-id-display" style="color:var(--text-muted);font-size:12px;"></span>
  <span id="status-badge">loading&hellip;</span>
  <span id="sse-indicator">○ connecting</span>
</header>

<main>
  <!-- Transcript (left, primary timeline) -->
  <section class="pane" id="pane-transcript">
    <div class="pane-title">Transcript</div>
    <div class="pane-body" id="transcript-list">
      <p class="empty">Loading&hellip;</p>
    </div>
  </section>

  <div id="dashboard-sidebar">
    <section class="pane" id="pane-turn">
      <div class="pane-title">Current Turn</div>
      <div class="pane-body" id="turn-status">
        <p class="empty">No active turn.</p>
      </div>
    </section>

    <section class="pane" id="pane-metrics">
      <div class="pane-title">Turn Metrics</div>
      <div class="pane-body" id="metrics-list">
        <p class="empty">No runtime metrics yet.</p>
      </div>
    </section>

    <section class="pane" id="pane-tools">
      <div class="pane-title">Active Tool Calls</div>
      <div class="pane-body" id="tool-calls-list">
        <p class="empty">No active tool calls.</p>
      </div>
    </section>

    <section class="pane" id="pane-output">
      <div class="pane-title">Live Command Output</div>
      <div class="pane-body" id="live-output-list">
        <p class="empty">No live output yet.</p>
      </div>
    </section>

    <section class="pane" id="pane-approvals">
      <div class="pane-title">Pending Approvals</div>
      <div class="pane-body" id="approvals-list">
        <p class="empty">No pending approvals.</p>
      </div>
    </section>

    <section class="pane" id="pane-events">
      <div class="pane-title">Event Log</div>
      <div class="pane-body" id="event-log-list"></div>
    </section>
  </div>
</main>

<script type="module" src="/static/dashboard.js"></script>
</body>
</html>
