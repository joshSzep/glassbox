minimum_pre_commit_version: 4.5.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: unsupported
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: unsupported
        types_or: [python, pyi]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: unsupported
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: unsupported
        always_run: true
        pass_filenames: false
        types_or: [python, pyi]

      - id: eval-smoke
        name: glassbox eval run --tag smoke
        entry: uv run glassbox eval run --tag smoke --output-dir .glassbox/evals/pre-commit --cwd .
        language: unsupported
        always_run: true
        pass_filenames: false
