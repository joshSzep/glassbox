minimum_pre_commit_version: 4.5.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: unsupported
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: unsupported
        types_or: [python, pyi]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: unsupported
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest
        name: pytest (xdist loadfile)
        entry: uv run pytest -n auto --dist loadfile
        language: unsupported
        always_run: true
        pass_filenames: false
        types_or: [python, pyi]

      - id: eval
        name: glassbox eval run
        entry: uv run glassbox eval run --output-dir .glassbox/evals/pre-commit --refresh-output-dir --cwd .
        language: unsupported
        always_run: true
        pass_filenames: false

      - id: frontend-format-check
        name: frontend format check
        entry: pnpm --dir frontend format:check
        language: unsupported
        pass_filenames: false
        files: ^frontend/

      - id: frontend-lint
        name: frontend lint
        entry: pnpm --dir frontend lint
        language: unsupported
        pass_filenames: false
        files: ^frontend/

      - id: frontend-typecheck
        name: frontend typecheck
        entry: pnpm --dir frontend typecheck
        language: unsupported
        pass_filenames: false
        files: ^frontend/

      - id: frontend-test
        name: frontend unit and component tests
        entry: pnpm --dir frontend test
        language: unsupported
        pass_filenames: false
        files: ^frontend/

      - id: frontend-api-generate
        name: frontend generated API freshness
        entry: pnpm --dir frontend api:generate
        language: unsupported
        pass_filenames: false
        files: ^(frontend/|src/glassbox/web/)

      - id: frontend-build
        name: frontend static export check
        entry: pnpm --dir frontend build
        language: unsupported
        pass_filenames: false
        files: ^frontend/

      - id: frontend-e2e
        name: frontend playwright workflows
        entry: pnpm --dir frontend test:e2e
        language: unsupported
        pass_filenames: false
        files: ^frontend/
