name: Push Smoke Evals

on:
  push:
    branches:
      - main

jobs:
  push-smoke-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVAL_OUTPUT_DIR: .glassbox/evals/push-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run push smoke eval suite
        id: smoke
        continue-on-error: true
        run: >-
          uv run glassbox eval run --tag smoke
          --output-dir "$EVAL_OUTPUT_DIR"
          --refresh-output-dir
          --cwd .

      - name: Upload push smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-smoke-evals-${{ github.sha }}
          path: .glassbox/evals/push-smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow on smoke drift
        if: steps.smoke.outcome == 'failure'
        run: exit 1
