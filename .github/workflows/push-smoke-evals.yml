name: Push Smoke Evals

on:
  push:
    branches:
      - main

jobs:
  push-smoke-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVAL_OUTPUT_DIR: .glassbox/evals/push-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run push smoke eval suite
        id: smoke
        continue-on-error: true
        run: >-
          uv run glassbox eval run --profile push-confirmation
          --output-dir "$EVAL_OUTPUT_DIR"
          --refresh-output-dir
          --cwd .

      - name: Publish push smoke summary
        if: always()
        env:
          ARTIFACT_NAME: push-smoke-evals-${{ github.sha }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from glassbox.runtime.eval_summary import (
              build_eval_suite_annotations,
              build_eval_suite_job_summary,
              build_eval_suite_summary_payload,
              format_github_actions_annotation,
              load_eval_suite_result,
          )

          summary_path = Path(os.environ["EVAL_OUTPUT_DIR"]) / "summary.json"
          artifact_name = os.environ["ARTIFACT_NAME"]
          artifact_root = os.environ["EVAL_OUTPUT_DIR"]

          if not summary_path.exists():
              raise SystemExit(f"missing push smoke summary: {summary_path}")

          result = load_eval_suite_result(summary_path)
          summary_text = build_eval_suite_job_summary(
              result,
              artifact_name=artifact_name,
              artifact_root=artifact_root,
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary_text)

          payload = build_eval_suite_summary_payload(
              result,
              artifact_name=artifact_name,
              artifact_root=artifact_root,
          )
          print("push-smoke-summary-json=" + json.dumps(payload, sort_keys=True))

          for annotation in build_eval_suite_annotations(result, artifact_root=artifact_root):
              print(format_github_actions_annotation(annotation))
          PY

      - name: Upload push smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-smoke-evals-${{ github.sha }}
          path: .glassbox/evals/push-smoke/
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow on smoke drift
        if: steps.smoke.outcome == 'failure'
        run: exit 1
