[project]
name = "glassbox"
version = "0.10.0"
description = "A local-first CLI agent harness with a live dashboard."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Joshua Szepietowski" }]
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pydantic-ai>=1.83,<2",
    "textual>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
glassbox = "glassbox.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<0.16",
    "ty>=0.0.1a16,<0.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "TID", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
markers = [
    "anyio: async tests that run under the AnyIO pytest plugin",
    "daemon: tests that start, stop, inspect, or guard the workspace daemon boundary",
    "release_gate: smoke tests required by full release confidence checks",
    "slow: tests that are intentionally expensive for reasons not covered by a narrower marker",
    "subprocess: tests that spawn a real subprocess boundary",
    "timeout: tests that intentionally exercise timeout behavior",
    "tui: tests that run or smoke the terminal Textual app boundary",
]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"
root = [".", "./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.hatch.build.targets.wheel]
packages = ["src/glassbox"]
artifacts = ["src/glassbox/web/static_next/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/evals",
    "/frontend/generated",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
artifacts = ["src/glassbox/web/static_next/**"]
