[project]
name = "glassbox"
version = "0.1.0"
description = "A local-first CLI agent harness with a live dashboard."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Joshua Szepietowski" }]
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pydantic-ai>=1.83,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
glassbox = "glassbox.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "ruff>=0.15,<0.16",
    "ty>=0.0.1a16,<0.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "TID", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"
root = [".", "./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.hatch.build.targets.wheel]
packages = ["src/glassbox"]
artifacts = ["src/glassbox/web/static_next/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]
artifacts = ["src/glassbox/web/static_next/**"]
